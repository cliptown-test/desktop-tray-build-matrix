name: Desktop tray build matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tray-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIPTOWN_FLUTTER_REF: 03374a187929662b62b2a8116dafa4fe1239a1b0
  CLIPTOWN_INTERFACES_REF: e4e957b5372dc363fe6a52559c8959f0de781efb

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          show-progress: false
      - run: node scripts/validate-plan.mjs

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: macos-14
            target: macos
          - os: windows-2022
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out pinned Flutter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: cliptown/cliptown-flutter
          ref: ${{ env.CLIPTOWN_FLUTTER_REF }}
          path: cliptown-flutter
          persist-credentials: false
          show-progress: false
      - name: Check out pinned interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: cliptown/cliptown-interfaces
          ref: ${{ env.CLIPTOWN_INTERFACES_REF }}
          path: cliptown-interfaces
          persist-credentials: false
          show-progress: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          channel: stable
          cache: true
      - name: Run lifecycle policy tests and build native app
        shell: bash
        working-directory: cliptown-flutter
        run: |
          flutter config --enable-${{ matrix.target }}-desktop
          flutter pub get
          flutter test test/desktop_lifecycle_controller_test.dart --reporter=expanded
          flutter build ${{ matrix.target }} --debug
